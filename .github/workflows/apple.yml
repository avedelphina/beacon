name: Apple app

# Only when the app or what it is tested against changes: macOS runners cost more than Linux ones.
on:
  push:
    paths: ["apps/apple/**", "apps/contract/**", ".github/workflows/apple.yml"]
  pull_request:
    paths: ["apps/apple/**", "apps/contract/**", ".github/workflows/apple.yml"]

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test on an iPhone simulator
        working-directory: apps/apple
        # Signed "to run locally" (no team needed), so the tests can use the Keychain.
        run: |
          xcodebuild -version
          name=$(xcrun simctl list devices available -j | python3 -c \
            'import json,sys; print(next(d["name"] for r in json.load(sys.stdin)["devices"].values() for d in r if d["name"].startswith("iPhone")))')
          xcodebuild test -project Beacon.xcodeproj -scheme Beacon -destination "platform=iOS Simulator,name=$name"
