# tbot generates ssh_config with IdentityFile/CertificateFile/
# UserKnownHostsFile baked in as absolute paths under --destination — both
# containers mount that output at the same internal path (/tbot-data) so
# those paths resolve identically in whichever container reads the file.
# fleet/hosts.yaml's ssh.config_file should point at /tbot-data/ssh_config.
#
# tbot needs a join token only once, ever: `tctl bots add beacon
# --roles=agent` on the cluster, then either pass it as TBOT_TOKEN the
# first time this comes up, or (as here) just reuse an already-established
# ./tbot/storage from a prior `tbot/run.sh` — tbot renews from its own
# stored identity after that and never needs the token again.
services:
  # Runs once before the others and hands the directories they write to the user
  # they run as, so an upgrade needs no manual chown. It is the only container
  # that runs as root. BEACON_RUN_AS=0:0 keeps everything as root, as before 0.32.
  init:
    build: .
    user: "0:0"
    entrypoint: ["sh", "-c", 'chown -R "$$RUN_AS" /state /tbot-data /tbot-storage']
    environment:
      - RUN_AS=${BEACON_RUN_AS:-10001:10001}
    volumes:
      - ./state:/state
      - ./tbot/data:/tbot-data
      - ./tbot/storage:/tbot-storage
    restart: "no"

  tbot:
    build: ./tbot
    volumes:
      - ./tbot/data:/tbot-data
      - ./tbot/storage:/tbot-storage
    command:
      - start
      - identity
      - --destination=file:///tbot-data
      - --storage=file:///tbot-storage
      - --proxy-server=${TELEPORT_PROXY_SERVER:-teleport.example.com:443}
      - --join-method=token
    user: ${BEACON_RUN_AS:-10001:10001}
    depends_on:
      init:
        condition: service_completed_successfully
    mem_limit: ${TBOT_MEM_LIMIT:-256m}
    restart: unless-stopped

  beacon:
    build: .
    ports:
      # Loopback-only by default — with no .env, AUTH_ENABLED is false and
      # every /api/* route is unauthenticated (see backend/auth.py). Set
      # BEACON_BIND_HOST to expose it beyond this machine, and set up
      # ZITADEL_ISSUER/ZITADEL_CLIENT_ID first if you do.
      - "${BEACON_BIND_HOST:-127.0.0.1}:8642:8642"
      # Agents' hosts pull their A2A mesh config (GET /mesh/*) here. Set
      # BEACON_MESH_BIND to the address:port they reach Beacon on, e.g. a
      # tailnet IP; the default only duplicates loopback. It is the same app,
      # so OIDC must be configured before this leaves loopback.
      - "${BEACON_MESH_BIND:-127.0.0.1:18642}:8642"
    volumes:
      # Only for `python -m backend.fleet import|export` and the one-time import on a
      # store's first start; the fleet itself lives in ./state.
      - ./fleet:/app/fleet
      # Operational store (backend/opstore.py): the fleet itself, mailbox, board, workflows.
      - ./state:/app/state
      - ./ssh:/etc/beacon:ro
      - ./tbot/data:/tbot-data:ro
    # The agent mesh settings (BEACON_A2A_SECRET, BEACON_PUBLIC_URL, ...)
    # live in .env too; the whole file goes in rather than a growing list.
    env_file:
      - path: .env
        required: false
    environment:
      - ZITADEL_ISSUER=${ZITADEL_ISSUER:-}
      - ZITADEL_CLIENT_ID=${ZITADEL_CLIENT_ID:-}
      - BEACON_SESSION_SECRET=${BEACON_SESSION_SECRET:-}
      - BEACON_SESSION_HTTPS_ONLY=${BEACON_SESSION_HTTPS_ONLY:-true}
      - BEACON_KNOWN_HOSTS=${BEACON_KNOWN_HOSTS:-/etc/beacon/known_hosts}
      - BEACON_MCP_TOKEN=${BEACON_MCP_TOKEN:-}
      # uvicorn believes X-Forwarded-Proto/For only from these addresses. Behind a
      # TLS-terminating proxy, name the proxy's address here or the OIDC redirect
      # URI is built as http:// and login fails. Never "*" on a port that clients
      # can reach directly: they could then claim any address or scheme.
      - FORWARDED_ALLOW_IPS=${BEACON_TRUSTED_PROXIES:-127.0.0.1}
    depends_on:
      init:
        condition: service_completed_successfully
      tbot:
        condition: service_started
    # /manifest.json is served without a session, so this works with OIDC on.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8642/manifest.json', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Unprivileged by default; the init service owns ./state and ./tbot/* for this
    # user first. Set BEACON_RUN_AS=0:0 to run as root.
    user: ${BEACON_RUN_AS:-10001:10001}
    mem_limit: ${BEACON_MEM_LIMIT:-1g}
    restart: unless-stopped

  mcp:
    build: ./mcp
    environment:
      - BEACON_URL=http://beacon:8642
      - BEACON_MCP_TOKEN=${BEACON_MCP_TOKEN:-}
    ports:
      # Same loopback-by-default reasoning as the beacon service above.
      - "${BEACON_BIND_HOST:-127.0.0.1}:8643:8643"
    depends_on:
      beacon:
        condition: service_healthy
    # /mcp wants MCP headers, so only check that the port accepts connections.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8643), timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: ${MCP_MEM_LIMIT:-256m}
    restart: unless-stopped
